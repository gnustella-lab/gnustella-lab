<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Gnustella Lab terminal profile</title>
  <desc id="desc">A dark terminal-style developer profile with space-inspired ASCII art and information about gnustella-lab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#120d1d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="50%" stop-color="#c792ea"/>
      <stop offset="100%" stop-color="#ff7ab2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="617" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="3"/>
  <rect x="18" y="18" width="1164" height="48" rx="10" fill="#0b0e15" stroke="#21262d"/>
  <circle cx="43" cy="42" r="7" fill="#ff5f56"/>
  <circle cx="66" cy="42" r="7" fill="#ffbd2e"/>
  <circle cx="89" cy="42" r="7" fill="#27c93f"/>
  <text x="118" y="48" fill="#8b949e" font-size="18" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">gnustella@lab: ~</text>
  <text x="1040" y="48" fill="#484f58" font-size="15" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">README.svg</text>

  <line x1="435" y1="92" x2="435" y2="548" stroke="#21262d" stroke-width="2"/>

  <!-- ASCII art -->
  <g xml:space="preserve" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="18" fill="#c9d1d9">
    <text x="62" y="118" fill="#79c0ff">                 .          *</text>
    <text x="62" y="142" fill="#8b949e">        *              .          .</text>
    <text x="62" y="166" fill="#c792ea">                   .-''''''-.</text>
    <text x="62" y="190" fill="#c792ea">                .-'   .--.   '-.</text>
    <text x="62" y="214" fill="#d2a8ff">              .'     / /\ \     '.</text>
    <text x="62" y="238" fill="#d2a8ff">             /      / /  \ \      \</text>
    <text x="62" y="262" fill="#ff7ab2">            ;      | | () | |      ;</text>
    <text x="62" y="286" fill="#ff7ab2">            |      | |    | |      |</text>
    <text x="62" y="310" fill="#d2a8ff">            ;       \ \__/ /       ;</text>
    <text x="62" y="334" fill="#d2a8ff">             \        '--'        /</text>
    <text x="62" y="358" fill="#c792ea">              '.                .'</text>
    <text x="62" y="382" fill="#c792ea">                '-.__________.-'</text>
    <text x="62" y="406" fill="#8b949e">          *          /_/          .</text>
    <text x="62" y="430" fill="#79c0ff">                  .-'   '-.</text>
    <text x="62" y="454" fill="#79c0ff">                 /  .---.  \</text>
    <text x="62" y="478" fill="#79c0ff">                 '-------'</text>
    <text x="62" y="512" fill="url(#accent)" font-size="22" font-weight="700" filter="url(#glow)">              GNUS · STELLA · LAB</text>
  </g>

  <!-- Profile information -->
  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="480" y="120" fill="#f0f6fc" font-size="26" font-weight="700">gnustella-lab</text>
    <text x="690" y="120" fill="#484f58" font-size="19">------------------------</text>

    <g font-size="18">
      <text x="480" y="160" fill="#ff7ab2">user</text><text x="595" y="160" fill="#484f58">................</text><text x="790" y="160" fill="#c9d1d9">gnustella-lab</text>
      <text x="480" y="193" fill="#ff7ab2">role</text><text x="595" y="193" fill="#484f58">................</text><text x="790" y="193" fill="#c9d1d9">open-source developer</text>
      <text x="480" y="226" fill="#ff7ab2">location</text><text x="595" y="226" fill="#484f58">............</text><text x="790" y="226" fill="#c9d1d9">Brazil</text>
      <text x="480" y="259" fill="#ff7ab2">os</text><text x="595" y="259" fill="#484f58">..................</text><text x="790" y="259" fill="#79c0ff">Linux Mint / Windows</text>
      <text x="480" y="292" fill="#ff7ab2">editor</text><text x="595" y="292" fill="#484f58">..............</text><text x="790" y="292" fill="#79c0ff">VS Code</text>

      <text x="480" y="340" fill="#c792ea">languages</text><text x="595" y="340" fill="#484f58">............</text><text x="790" y="340" fill="#c9d1d9">Java · JavaScript · TypeScript</text>
      <text x="790" y="369" fill="#c9d1d9">Python · C# · HTML/CSS · C++</text>

      <text x="480" y="417" fill="#c792ea">focus</text><text x="595" y="417" fill="#484f58">................</text><text x="790" y="417" fill="#c9d1d9">AI tools · browser privacy</text>
      <text x="790" y="446" fill="#c9d1d9">Minecraft plugins · desktop apps</text>

      <text x="480" y="494" fill="#79c0ff">projects</text><text x="595" y="494" fill="#484f58">............</text><text x="790" y="494" fill="#c9d1d9">GhostPrint · SpotWin</text>
      <text x="790" y="523" fill="#c9d1d9">GnustellaCore · GnustellaWelcome</text>

      <text x="480" y="571" fill="#7ee787">status</text><text x="595" y="571" fill="#484f58">..............</text><text x="790" y="571" fill="#7ee787">building useful experiments_</text>
    </g>
  </g>

  <rect x="40" y="590" width="1120" height="2" fill="url(#accent)" opacity="0.75"/>
</svg>

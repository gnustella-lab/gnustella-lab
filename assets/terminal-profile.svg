<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Gnustella Lab terminal profile</title>
  <desc id="desc">A dark terminal-style developer profile featuring Linux Mint ASCII art and information about gnustella-lab.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b12"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#120d1d"/>
    </linearGradient>

<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#79c0ff"/>
  <stop offset="50%" stop-color="#c792ea"/>
  <stop offset="100%" stop-color="#ff7ab2"/>
</linearGradient>

<linearGradient id="mintAccent" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#d8f3c8"/>
  <stop offset="45%" stop-color="#87cf3e"/>
  <stop offset="100%" stop-color="#5fae2f"/>
</linearGradient>

<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

  </defs>

